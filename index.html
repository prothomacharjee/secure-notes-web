<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Secure Notes</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.1.11"></script>
  <style type="text/tailwindcss">
    @layer components {
      section { @apply bg-white rounded-xl shadow-sm ring-1 ring-slate-200 p-5; }
      h2 { @apply text-lg font-semibold text-slate-800 mb-3; }
      form { @apply flex flex-wrap gap-2 mb-4; }
      input, textarea, select { @apply rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500; }
      input:not([type=hidden]) { @apply flex-1 min-w-40; }
      textarea { @apply w-full; }
      button { @apply rounded-lg bg-indigo-600 px-4 py-2 text-sm font-medium text-white hover:bg-indigo-700 cursor-pointer transition; }
      .btn-ghost { @apply bg-white text-slate-700 ring-1 ring-slate-300 hover:bg-slate-100 px-3 py-1; }
      .btn-danger { @apply bg-white text-red-600 ring-1 ring-red-200 hover:bg-red-50 px-3 py-1; }
      .err { @apply w-full text-sm text-red-600 empty:hidden; }
      ul { @apply space-y-2; }
      li { @apply rounded-lg border border-slate-200 bg-slate-50 p-3 text-sm text-slate-700; }
      li > strong { @apply block text-slate-900; }
      li > div { @apply mt-1 mb-2 whitespace-pre-wrap text-slate-600; }
      li > button { @apply mr-2; }
      [id$=-pager] { @apply mt-3 flex items-center gap-2 text-sm text-slate-500; }
    }
  </style>
</head>
<body class="min-h-screen bg-slate-100 text-slate-800 antialiased">
  <header class="bg-white border-b border-slate-200">
    <div class="mx-auto max-w-4xl px-4 py-4 flex items-center justify-between gap-4">
      <h1 class="text-xl font-bold text-indigo-600">🔒 Secure Notes</h1>
      <div id="userbar" class="flex items-center gap-3 text-sm" hidden>
        <span id="me" class="font-medium"></span>
        <button id="logout" class="btn-ghost">Logout</button>
      </div>
    </div>
  </header>

  <main class="mx-auto max-w-4xl px-4 py-6 space-y-6">
    <p id="error" role="alert" class="rounded-lg bg-red-50 px-4 py-3 text-sm text-red-700 ring-1 ring-red-200 empty:hidden"></p>

    <div id="guest" class="grid gap-6 md:grid-cols-2">
      <section>
        <h2>Login</h2>
        <form id="login-form" class="flex-col">
          <input name="email" type="email" placeholder="Email" required maxlength="254" aria-label="Email">
          <input name="password" type="password" placeholder="Password" required aria-label="Password">
          <p class="err" role="alert"></p>
          <button>Login</button>
        </form>
      </section>
      <section>
        <h2>Create account</h2>
        <form id="register-form" class="flex-col">
          <input name="name" placeholder="Name" required maxlength="100" aria-label="Name">
          <input name="email" type="email" placeholder="Email" required maxlength="254" aria-label="Email">
          <input name="password" type="password" placeholder="Password (min 8)" minlength="8" required aria-label="Password">
          <input name="interests" placeholder="Interests: chess, reading" aria-label="Interests">
          <p class="err" role="alert"></p>
          <button>Register</button>
        </form>
      </section>
    </div>

    <div id="app" class="space-y-6" hidden>
      <section>
        <h2>My notes</h2>
        <form id="note-form">
          <input name="title" placeholder="Title" required maxlength="200" aria-label="Title">
          <textarea name="body" rows="3" required maxlength="10000" placeholder="Write something…" aria-label="Body"></textarea>
          <input name="id" type="hidden">
          <p class="err" role="alert"></p>
          <button>Save note</button>
          <button type="button" id="note-cancel" class="btn-ghost" hidden>Cancel edit</button>
        </form>
        <ul id="notes"></ul>
        <div id="notes-pager"></div>
      </section>

      <div class="grid gap-6 md:grid-cols-2">
        <section>
          <h2>Posts</h2>
          <form id="post-form">
            <input name="title" placeholder="Post title" required maxlength="200" aria-label="Post title">
            <textarea name="body" rows="2" required maxlength="10000" placeholder="Share with everyone…" aria-label="Post body"></textarea>
            <p class="err" role="alert"></p>
            <button>Publish</button>
          </form>
          <form id="posts-user-form">
            <input name="userId" placeholder="User id (empty = me)" aria-label="User id">
            <p class="err" role="alert"></p>
            <button class="btn-ghost">Show posts</button>
          </form>
          <p id="posts-title" class="mb-2 text-xs text-slate-500"></p>
          <ul id="posts"></ul>
          <div id="posts-pager"></div>
        </section>

        <section>
          <h2>Users by interest</h2>
          <ul id="interests"></ul>
          <div id="interests-pager"></div>
        </section>
      </div>

      <div id="admin" class="space-y-6" hidden>
        <h2 class="!mb-0 text-xs font-semibold uppercase tracking-wider text-indigo-600">Admin panel</h2>
        <section>
          <h2>Users</h2>
          <form id="user-form">
            <input name="name" placeholder="Name" required maxlength="100" aria-label="Name">
            <input name="email" type="email" placeholder="Email" required maxlength="254" aria-label="Email">
            <input name="password" type="password" placeholder="Password (min 8)" minlength="8" required aria-label="Password">
            <input name="interests" placeholder="Interests" aria-label="Interests">
            <select name="role" aria-label="Role"><option>user</option><option>admin</option></select>
            <input name="id" type="hidden">
            <p class="err" role="alert"></p>
            <button>Save user</button>
            <button type="button" id="user-cancel" class="btn-ghost" hidden>Cancel edit</button>
          </form>
          <ul id="users"></ul>
          <div id="users-pager"></div>
        </section>
        <section>
          <h2>All notes</h2>
          <p class="err" role="alert"></p>
          <ul id="all-notes"></ul>
          <div id="all-notes-pager"></div>
        </section>
      </div>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
